[project]
name = "primo-mcp"
version = "0.1.0"
description = "Test MCP server for searching the library catalogue"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0", "python-dotenv>=1.0","httpx2>=0.27","pytest>=8"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
packages = ["library_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["library_mcp/tests"]
